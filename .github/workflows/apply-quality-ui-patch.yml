name: Apply quality UI patch

on:
  push:
    branches: [main]
    paths:
      - '.github/patch_quality_ui.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/patch_quality_ui.py
      - name: Validate TypeScript syntax/build
        working-directory: cloudflare
        run: npx --yes wrangler@latest deploy --dry-run --outdir=.wrangler-dry-run
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/src/index.ts cloudflare/src/dashboard.ts cloudflare/src/factcheck.ts
          git commit -m 'fix: tighten factcheck and separate post title UI' || echo 'No source changes to commit'
          git push
      - name: Remove temporary patch files
        run: |
          rm -f .github/patch_quality_ui.py .github/workflows/apply-quality-ui-patch.yml
          git add -A
          git commit -m 'chore: remove temporary patch workflow' || echo 'Temporary files already removed'
          git push
