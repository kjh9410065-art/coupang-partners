name: Repair factcheck patch script

on:
  push:
    paths:
      - ".github/workflows/repair-factcheck-patch.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove nested workflow-generation block from patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/patch-factcheck.py')
          s = p.read_text(encoding='utf-8')
          marker = '\n# 일회성 수정 워크플로우를 만들고 다음 단계에서 스스로 삭제합니다.'
          if marker in s:
              s = s.split(marker, 1)[0] + '\n'
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/patch-factcheck.py
          git commit -m "Fix factcheck patch script" || exit 0
          git push
      - name: Remove repair workflow
        run: |
          rm -f .github/workflows/repair-factcheck-patch.yml
          git add -A
          git commit -m "Remove temporary repair workflow" || exit 0
          git push
