name: Fix factcheck syntax

on:
  push:
    paths:
      - ".github/workflows/fix-factcheck-syntax.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stray string terminator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/patch-factcheck.py')
          s = p.read_text(encoding='utf-8')
          if s.rstrip().endswith("''')"):
              s = s.rstrip()[:-4].rstrip() + "\n"
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/patch-factcheck.py
          git commit -m "Fix factcheck patch syntax" || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-factcheck-syntax.yml
          git add -A
          git commit -m "Remove temporary syntax fix workflow" || exit 0
          git push
