name: Adjust quality threshold
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch generation threshold
        shell: python
        run: |
          from pathlib import Path
          p = Path('cloudflare/src/index.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('for (let attempt = 1; attempt <= 5; attempt++) {', 'for (let attempt = 1; attempt <= 3; attempt++) {', 1)
          s = s.replace('if (qualityCheck.ok && qualityCheck.score === 100) break;', 'if (qualityCheck.ok && qualityCheck.score >= 90) break;', 1)
          s = s.replace('if (attempt === 5) {', 'if (attempt === 3) {', 1)
          s = s.replace('품질 검사 100점 미달로 저장하지 않았습니다.', '품질 검사 90점 미달로 저장하지 않았습니다.', 1)
          s = s.replace('품질 점수가 100점이 될 때까지 생성 결과를 다시 만듭니다.', '품질 점수가 90점 이상이 될 때까지 생성 결과를 다시 만듭니다.', 1)
          s = s.replace('품질 점수를 100점으로 맞추고 모든 제목과 본문의 완성도를 다시 높이세요.', '품질 점수를 90점 이상으로 맞추고 모든 제목과 본문의 완성도를 다시 높이세요.', 1)
          s = s.replace('score: 100,', 'score: qualityCheck.score,', 1)
          s = s.replace('passed: true,', 'passed: qualityCheck.ok,', 1)
          s = s.replace('ok: true,', 'ok: qualityCheck.ok,', 1)
          s = s.replace('reasons: [],', 'reasons: qualityCheck.reasons,', 1)
          p.write_text(s, encoding='utf-8')
          w = Path('.github/workflows/adjust-quality-threshold.yml')
          w.unlink(missing_ok=True)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/src/index.ts .github/workflows/adjust-quality-threshold.yml
          git commit -m '품질 통과 기준 90점으로 조정' || exit 0
          git push origin main
