name: format and factcheck patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply content, factcheck, and dashboard fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          # 1) 팩트체크 모듈을 추가합니다. 외부 추측 대신 쿠팡 API로 받은 확정 정보와 본문을 비교합니다.
          fact = root / 'cloudflare/src/factcheck.ts'
          fact.write_text(r'''/**
           * 생성된 본문을 쿠팡 API에서 확인된 상품 정보와 대조하는 팩트체크 모듈입니다.
           * 별도의 외부 리뷰를 사실로 취급하지 않고, 확인되지 않은 상품 스펙을 걸러냅니다.
           */
          export interface FactCheckResult {
            ok: boolean;
            reasons: string[];
            checkedAt: string;
          }

          function escapeRegExp(value: string) {
            return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          }

          export function factCheckBlog(body: string, product: any, keyword: string): FactCheckResult {
            const text = String(body ?? "");
            const reasons: string[] = [];
            const productName = String(product?.productName ?? "").trim();
            const normalizedBody = text.replace(/\s+/g, "");
            const normalizedProduct = productName.replace(/\s+/g, "");
            const price = Number(product?.productPrice);
            const rank = Number(product?.rank);

            // API에 확인된 기본 정보와 모순되는 배송/검색순위 표현을 차단합니다.
            if (/로켓배송/.test(text) && product?.isRocket !== true) reasons.push("로켓배송 정보가 API 확인값과 다릅니다.");
            if (/무료배송/.test(text) && product?.isFreeShipping !== true) reasons.push("무료배송 정보가 API 확인값과 다릅니다.");
            if (/검색\s*순위|검색결과\s*순위/.test(text) && Number.isFinite(rank) && !new RegExp(`(?:${rank})\\s*위`).test(text)) reasons.push("검색 순위가 API 확인값과 다릅니다.");

            // 본문에 상품명이 없으면 상품 식별 자체가 불가능하므로 실패 처리합니다.
            if (productName && !normalizedBody.includes(normalizedProduct)) reasons.push("본문에서 확인된 상품명이 누락되었습니다.");

            // 가격을 언급한다면 현재 API 값과 정확히 일치하는 숫자만 허용합니다.
            if (/(?:가격|판매가|현재가|원)/.test(text) && Number.isFinite(price) && price > 0) {
              const priceText = price.toLocaleString("ko-KR");
              if (!text.includes(priceText) && !text.includes(String(price))) reasons.push("본문의 가격 표현이 API 확인값과 일치하지 않습니다.");
            }

            // 숫자가 붙는 대표적인 상품 스펙은 상품명 또는 확인된 텍스트에 직접 근거가 없으면 차단합니다.
            const riskySpecs = [
              /\d+(?:\.\d+)?\s*(?:kg|g|cm|mm|m|L|ml|W|dB|시간|분|Ah|mAh)/gi,
              /\d+(?:\.\d+)?\s*(?:단계|단|인치|리터|와트)/gi,
            ];
            for (const pattern of riskySpecs) {
              const matches = text.match(pattern) ?? [];
              for (const match of matches) {
                if (!new RegExp(escapeRegExp(match), "i").test(productName) && !new RegExp(escapeRegExp(match), "i").test(text.slice(0, Math.min(text.length, 500)))) {
                  // 상품명에 없는 수치 스펙은 AI가 만들어냈을 가능성이 높으므로 차단합니다.
                  reasons.push(`확인되지 않은 수치형 상품 스펙이 포함될 가능성이 있습니다: ${match}`);
                  break;
                }
              }
              if (reasons.length) break;
            }

            return { ok: reasons.length === 0, reasons, checkedAt: new Date().toISOString() };
          }
          ''', encoding='utf-8')

          # 2) index.ts에 팩트체크를 한 번 적용하고, 90점 이상만 저장하도록 연결합니다.
          index = root / 'cloudflare/src/index.ts'
          s = index.read_text(encoding='utf-8')
          if 'from "./factcheck"' not in s:
              s = s.replace('import { validateContentQuality } from "./quality";', 'import { validateContentQuality } from "./quality";\nimport { factCheckBlog } from "./factcheck";')

          old = '''    qualityCheck = validateContentQuality({
      keyword,
      productName: recommendation.product.productName,
      titles: blog.titles,
      selectedTitle: blog.selectedTitle,
      body: blog.body,
    });

    if (qualityCheck.ok && qualityCheck.score >= 90) break;

    qualityFeedback = qualityCheck.reasons.length
      ? qualityCheck.reasons
      : ["품질 점수를 90점 이상으로 맞추고 모든 제목과 본문의 완성도를 다시 높이세요."];
'''
          new = '''    qualityCheck = validateContentQuality({
      keyword,
      productName: recommendation.product.productName,
      titles: blog.titles,
      selectedTitle: blog.selectedTitle,
      body: blog.body,
    });

    // 품질검사와 별도로 확인된 상품 정보와 본문을 한 번 대조합니다.
    const factCheck = factCheckBlog(blog.body, recommendation.product, keyword);
    qualityCheck.factCheck = factCheck;

    if (qualityCheck.ok && qualityCheck.score >= 90 && factCheck.ok) break;

    qualityFeedback = [
      ...(qualityCheck.reasons ?? []),
      ...(factCheck.reasons ?? []),
    ];
    if (!qualityFeedback.length) qualityFeedback = ["품질 점수를 90점 이상으로 맞추고 확인되지 않은 상품 정보를 제거하세요."];
'''
          if old not in s:
              raise SystemExit('index.ts quality block not found')
          s = s.replace(old, new, 1)
          s = s.replace('''      reasons: [],
      metrics: qualityCheck.metrics,
''', '''      reasons: qualityCheck.reasons ?? [],
      metrics: qualityCheck.metrics,
      factCheck: qualityCheck.factCheck ?? { ok: true, reasons: [], checkedAt: new Date().toISOString() },
''', 1)
          index.write_text(s, encoding='utf-8')

          # 3) 대시보드: 제목을 별도 칸으로 분리하고 본문을 보기 좋게 렌더링합니다.
          dash = root / 'cloudflare/src/dashboard.ts'
          d = dash.read_text(encoding='utf-8')

          start = d.index('async function renderPost(')
          end = d.index('/** 최신 네이버/티스토리 콘텐츠와 게시 대기열을 함께 표시합니다. */', start)
          new_render = r'''async function renderPost(title: string, post: any, platform: string) {
            if (!post) return `<section class="card empty"><h2>${escapeHtml(title)}</h2><p>아직 생성된 콘텐츠가 없습니다.</p></section>`;
            const blog = getBlog(post);
            const product = post.recommendation?.product;
            const titles = Array.isArray(blog.titles) ? blog.titles : [];
            const images = await getValidImages(post);
            const selectedTitle = blog.selectedTitle ?? titles[0] ?? post.keyword ?? "자동 생성 콘텐츠";

            return `<section class="card">
              <div class="platform">${escapeHtml(platform)}</div>
              ${renderQuality(post)}

              <div class="title-box">
                <div class="box-label">제목</div>
                <div class="title-text">${escapeHtml(selectedTitle)}</div>
                <button type="button" class="small-copy" onclick="navigator.clipboard.writeText(${escapeJs(selectedTitle)}).then(()=>alert('제목을 복사했습니다.'))">제목 복사</button>
              </div>

              <p class="meta">검색 주제: ${escapeHtml(post.keyword ?? "-")} · 생성: ${escapeHtml(post.savedAt ?? "-")}</p>
              ${product?.productName ? `<div class="product-name">선정 상품 · ${escapeHtml(product.productName)}</div>` : ""}

              <div class="body body-with-images">
                ${renderBodyWithImages(blog.body ?? "", images)}
              </div>

              <div class="disclosure">${escapeHtml(blog.disclosure ?? "")}</div>
              ${(blog.partnerUrl || blog.productUrl) ? `<a class="link" href="${escapeHtml(blog.partnerUrl ?? blog.productUrl)}" target="_blank" rel="noopener noreferrer">상품 링크 열기</a>` : ""}
              ${renderCopyArea(post, platform)}
              ${titles.length ? `<details><summary>제목 후보 ${titles.length}개</summary><ol>${titles.map((item: string) => `<li>${escapeHtml(item)}</li>`).join("")}</ol></details>` : ""}
            </section>`;
          }

          '''
          d = d[:start] + new_render + d[end:]

          # 본문을 Markdown 비슷한 소제목에서 보기 좋은 HTML로 바꿉니다.
          body_start = d.index('function renderBodyWithImages(')
          body_end = d.index('/** 저장된 글의 이미지/본문/복사 영역을 카드 형태로 만듭니다. */', body_start)
          new_body = r'''function renderBodyWithImages(body: string, images: string[]) {
            const blocks = body.split(/\n\s*\n|\n(?=###?\s)/).map((item) => item.trim()).filter(Boolean);
            if (!blocks.length) return "";
            const output: string[] = [];
            let imageIndex = 0;

            for (let i = 0; i < blocks.length; i++) {
              const block = blocks[i];
              const heading = block.match(/^#{2,3}\s+(.+)$/);
              if (heading) {
                output.push(`<h3 class="body-heading">${escapeHtml(heading[1])}</h3>`);
              } else {
                const lines = block.split(/\n+/).map((line) => line.trim()).filter(Boolean);
                output.push(`<p>${lines.map((line) => escapeHtml(line)).join("<br>")}</p>`);
              }

              // 초반/중반/후반에 이미지를 분산해 넣습니다.
              if (images.length && imageIndex < images.length && (i === 0 || i === Math.floor(blocks.length / 2) || i === blocks.length - 2)) {
                const url = images[imageIndex++];
                output.push(`<figure class="body-image-wrap"><img class="body-image" src="${escapeHtml(url)}" alt="상품 이미지 ${imageIndex}" loading="lazy"><figcaption>상품 이미지 ${imageIndex}</figcaption></figure>`);
              }
            }
            while (imageIndex < images.length) {
              const url = images[imageIndex++];
              output.push(`<figure class="body-image-wrap"><img class="body-image" src="${escapeHtml(url)}" alt="상품 이미지 ${imageIndex}" loading="lazy"><figcaption>상품 이미지 ${imageIndex}</figcaption></figure>`);
            }
            return output.join("");
          }

          '''
          d = d[:body_start] + new_body + d[body_end:]

          # 본문 디자인을 조금 더 보기 좋게 만듭니다.
          d = d.replace('.card h2{margin:0 0 7px;font-size:21px}', '.card h2{margin:0 0 7px;font-size:21px}.title-box{position:relative;margin:10px 0 16px;padding:16px 16px 14px;border:1px solid #dbe3ee;border-radius:12px;background:#f8fafc}.box-label{font-size:11px;font-weight:800;color:#64748b;letter-spacing:.08em;margin-bottom:5px}.title-text{font-size:22px;font-weight:800;line-height:1.45;padding-right:80px}.small-copy{margin-top:10px;border:0;border-radius:8px;padding:7px 11px;background:#111827;color:#fff;font-size:12px;font-weight:700;cursor:pointer}')
          d = d.replace('.body{font-size:15px}', '.body{font-size:15px}.body-heading{margin:26px 0 10px;padding-left:10px;border-left:4px solid #111827;font-size:18px;line-height:1.4}.body-with-images p{margin:0 0 17px}.body-with-images p:first-child{font-size:16px}.body-image-wrap{margin:24px 0;text-align:center}.body-image{display:block;width:100%;max-height:430px;object-fit:contain;border:1px solid #e5e7eb;border-radius:12px;background:#fff}.body-image-wrap figcaption{margin-top:5px;color:#94a3b8;font-size:11px}')
          dash.write_text(d, encoding='utf-8')

      - name: Commit fixes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/src/index.ts cloudflare/src/dashboard.ts cloudflare/src/factcheck.ts
          git rm .github/workflows/patch-format-factcheck.yml
          git commit -m "본문 디자인 제목 분리 팩트체크 적용"
          git push
