name: Improve product-focused fallback

on:
  push:
    paths-ignore:
      - ".github/workflows/improve-product-description.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace generic fallback with product-focused content
        shell: python
        run: |
          from pathlib import Path
          p = Path("cloudflare/src/index.ts")
          s = p.read_text(encoding="utf-8")
          start = s.index('    const body=`안녕하세요. 오늘은 ${keyword} 검색 결과에서 확인된 ${productName}을 중심으로')
          end = s.index('    return JSON.stringify({ titles, selectedTitle: titles[0], body });', start)
          new = '''    // 상품명에 실제로 적혀 있는 표현만 추려 상품 설명에 활용합니다.
          const nameParts = productName.split(/\\s+/).filter(Boolean);
          const featureWords = nameParts.filter((word) => /LED|링라이트|조명|촬영|핸드폰|거치대|높이조절|유튜브|수직촬영|캠핑|보온|은박|마라톤|계곡|등산|러닝|실버|방한|보온용품/i.test(word));
          const visibleFeatures = featureWords.length ? [...new Set(featureWords)].join(", ") : productName;
          const body=`안녕하세요. 오늘은 ${keyword} 검색 결과에서 확인된 ${productName}을 상품명과 현재 검색 정보 기준으로 살펴보겠습니다.\\n\\n먼저 상품명에서 확인되는 내용부터 보면, 이 상품은 '${visibleFeatures}'라는 표현이 포함되어 있습니다. 여기서 확인되는 용도와 특징은 상품명에 표시된 범위까지만 설명하며, 상품명에 없는 성능이나 세부 사양은 임의로 추가하지 않습니다. 실제 구성이나 지원 기능은 구매 전 상품 상세 페이지에서 확인하는 것이 좋습니다.\\n\\n상품명에 ' ${featureWords.join(" ")}'처럼 여러 용도와 특징이 함께 표시되어 있다면, 구매할 때는 그중 본인에게 필요한 기능이 무엇인지 먼저 확인해보세요. 같은 검색어로 여러 상품이 노출될 수 있기 때문에 상품 이름이 비슷하다는 이유만으로 구성이나 성능이 같다고 판단하기보다는 상세 페이지의 옵션과 상품 안내를 함께 비교하는 편이 좋습니다.\\n\\n현재 쿠팡 검색 결과에서 확인된 가격은 ${price}원이고 검색 결과 순위는 ${rank}입니다. 이 숫자는 생성 당시 검색 결과에서 확인된 값이며 시간이 지나면 달라질 수 있습니다. 따라서 현재 가격만 보고 판단하기보다는 구매하려는 시점에 다시 상품 페이지를 열어 최신 가격과 선택 옵션을 확인하는 것이 좋습니다.\\n\\n배송 조건도 확인할 부분입니다. 현재 검색 결과에는 로켓배송 ${rocket}, 무료배송 ${freeShipping}으로 표시되어 있습니다. 배송 여부와 조건은 주문 시점이나 판매 조건에 따라 달라질 수 있으므로 실제 주문 화면에서 최종 내용을 확인해주세요.\\n\\n이 상품을 살펴볼 때는 먼저 상품명에 표시된 용도가 본인이 필요한 상황과 맞는지 확인하는 것이 좋습니다. 이후 상품 상세 페이지에서 크기와 구성, 선택 옵션처럼 구매 결정에 필요한 정보를 차례로 살펴보면 됩니다. 검색 결과에 표시되는 정보만으로 확인하기 어려운 항목은 추측해서 판단하지 않는 것이 안전합니다.\\n\\n또한 상품명에 여러 키워드가 들어간 경우에도 각각의 표현이 실제 상품의 어떤 부분을 의미하는지는 상세 페이지에서 확인해야 합니다. 예를 들어 용도와 사용 대상이 함께 적혀 있다면 해당 기능이 기본 구성인지 선택 옵션인지 살펴보고, 필요한 구성품이 포함되어 있는지도 주문 전에 확인해보세요.\\n\\n정리하면 ${productName}은 현재 ${keyword} 검색 결과에서 확인된 상품이며, 상품명에서 ${visibleFeatures}와 같은 표현을 확인할 수 있습니다. 가격은 ${price}원, 검색 순위는 ${rank}로 확인되지만 모두 검색 시점의 정보입니다. 구매 전에는 상품 상세 페이지에서 실제 사양과 구성, 옵션, 최신 가격과 배송 조건을 다시 확인하는 것이 좋습니다.\\n\\n관심이 있다면 상품 확인 버튼을 통해 현재 판매 페이지를 직접 확인해보세요. 상품명에서 확인할 수 있는 내용과 검색 결과의 숫자를 구분해서 살펴보면 본인에게 필요한 상품인지 비교하기가 한결 편합니다.`;\\n'''
          s = s[:start] + new + s[end:]
          p.write_text(s, encoding="utf-8")
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/src/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "Make fallback posts product-focused"
          git push
