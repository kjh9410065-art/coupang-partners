name: Apply structured product post template
on:
  push:
    paths-ignore:
      - ".github/workflows/apply-product-template.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply template
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path("cloudflare/src/index.ts")
          s = p.read_text(encoding="utf-8")
          if 'from "./content-template"' not in s:
              s = s.replace('import { factCheckContent, type ProductResearch } from "./factcheck";', 'import { factCheckContent, type ProductResearch } from "./factcheck";\nimport { buildProductPost } from "./content-template";')
          pattern = re.compile(r'  if \(prompt\.includes\("\[확인된 상품 정보\]"\)\) \{[\s\S]*?\n  \}\n  return JSON\.stringify\(\{ keyword: "생활용품", source: "fallback" \}\);', re.M)
          replacement = '''  if (prompt.includes("[확인된 상품 정보]")) {
    const keyword = prompt.match(/검색 주제:\\s*(.+)/)?.[1]?.trim() || "상품 정보";
    const productName = prompt.match(/상품명:\\s*(.+)/)?.[1]?.trim() || keyword;
    const researchMatch = prompt.match(/\\[팩트체크용 제품 조사 결과\\]\\s*([\\s\\S]*?)\\n\\n\\[참고용 사용자 의견 신호\\]/);
    let research: any = null;
    try { research = researchMatch ? JSON.parse(researchMatch[1]) : null; } catch {}
    const evidence = Array.isArray(research?.evidence) ? research.evidence : [];
    const post = buildProductPost(keyword, productName, evidence);
    return JSON.stringify(post);
  }
  return JSON.stringify({ keyword: "생활용품", source: "fallback" });'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit("confirmed product fallback block not found")
          marker = '- 광고 문구를 늘어놓는 글이 아니라, 사람이 실제로 구매를 고민할 때 도움이 되는 글을 만든다.'
          insert = '''- 광고 문구를 늘어놓는 글이 아니라, 사람이 실제로 상품을 이해하고 활용처를 판단할 수 있는 글을 만든다.
- 본문 순서는 자연스럽게 인사말 → 제품소개(상품명과 확인된 특징) → 추천이유 → 장점 → 단점 → 어디에 사용하면 좋은지 → 추천 사용처 → 상품 확인 안내 → 마무리 인사로 구성한다.
- 가격, 배송, 검색 순위, 가격 경쟁력, 무료배송, 로켓배송은 본문 소재로 사용하지 않는다.
- 파트너스 고지문은 본문에 직접 넣지 않는다. 화면에서 제목 바로 아래에 별도로 표시한다.
- 제품의 장점과 단점은 확인된 특징을 바탕으로 구체적으로 작성하고, 확인되지 않은 성능이나 스펙을 만들어내지 않는다.
- 같은 주의사항이나 구매 전 확인 문장을 반복하지 않는다.'''
          if marker in s:
              s = s.replace(marker, insert, 1)
          p.write_text(s, encoding="utf-8")
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/src/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "Use natural product-focused post structure"
          git push
