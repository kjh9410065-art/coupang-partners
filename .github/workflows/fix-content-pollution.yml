name: Fix content pollution

on:
  push:
    branches: [main]
    paths:
      - '.github/fix-content-pollution.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply fix
        run: python .github/fix-content-pollution.py
      - name: Validate TypeScript build
        working-directory: cloudflare
        run: npx --yes wrangler@latest deploy --dry-run --outdir=.wrangler-dry-run
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/src/index.ts
          git commit -m 'fix: block unrelated search content' || echo 'No source changes'
          git push
      - name: Remove temporary patch files
        run: |
          rm -f .github/fix-content-pollution.py .github/workflows/fix-content-pollution.yml
          git add -A
          git commit -m 'chore: remove temporary content pollution patch' || echo 'Temporary files already removed'
          git push
