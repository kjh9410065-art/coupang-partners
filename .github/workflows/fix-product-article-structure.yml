name: Fix product article structure
on:
  push:
    paths-ignore:
      - ".github/workflows/fix-product-article-structure.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace deterministic article fallback
        shell: python
        run: |
          from pathlib import Path
          p = Path("cloudflare/src/index.ts")
          s = p.read_text(encoding="utf-8")
          start = s.index('async function generateGemini')
          end = s.index('/** Google Trends', start)
          new = r'''async function generateGemini(env: Env, prompt: string, maxOutputTokens = 4096): Promise<string> {
  // AI를 사용할 수 없는 경우에도 웹 조사 근거를 이용해 상품 소개 글을 만듭니다.
  // 상품명 자체에서 특징을 추출하거나 가격/배송 정보를 본문에 넣지 않습니다.
  if (prompt.includes("상품 후보:")) {
    const m = prompt.match(/상품 후보:\s*([\s\S]*?)\n\n공개 웹 검색/);
    if (m) {
      try {
        const list = JSON.parse(m[1]);
        const first = Array.isArray(list) ? list[0] : null;
        if (first?.productId != null) return JSON.stringify({ productId: String(first.productId), reason: "검색 주제와 공개 조사 결과를 기준으로 상품을 선정했습니다." });
      } catch {}
    }
  }

  if (prompt.includes("Google Trends 한국 급상승 검색어 원문")) {
    return JSON.stringify({ keyword: "무선청소기", source: "fallback", reason: "AI 없이 사용하는 기본 상품군입니다." });
  }

  if (prompt.includes("[확인된 상품 정보]")) {
    const keyword = prompt.match(/검색 주제:\s*(.+)/)?.[1]?.trim() || "상품 정보";
    const productName = prompt.match(/상품명:\s*(.+)/)?.[1]?.trim() || keyword;

    // 공개 조사 결과만 읽습니다. 상품명에서 특징을 잘라내지 않습니다.
    let evidence: string[] = [];
    try {
      const researchMatch = prompt.match(/\[팩트체크용 제품 조사 결과\]\s*([\s\S]*?)\n\n\[참고용 사용자 의견 신호\]/);
      if (researchMatch) {
        const research = JSON.parse(researchMatch[1]);
        evidence = Array.isArray(research?.evidence) ? research.evidence.filter((x: unknown) => typeof x === "string" && x.trim()) : [];
      }
    } catch {}

    // 조사 결과가 없으면 확인되지 않은 특징을 만들어내지 않습니다.
    const usableEvidence = [...new Set(evidence.map((x) => x.replace(/\s+/g, " ").trim()))].slice(0, 4);
    const detail = usableEvidence.length
      ? usableEvidence.join(" ")
      : "현재 공개 조사에서 제품의 구체적인 특징을 충분히 확인하지 못했습니다.";

    const titles = [
      `${productName} 제품 소개와 활용 방법 정리`,
      `${productName} 특징과 추천 사용처 알아보기`,
      `${productName} 어떤 분께 잘 맞을까?`,
      `${productName} 장점과 아쉬운 점 정리`,
      `${productName} 제품 정보와 활용 아이디어`,
    ];

    const body = `안녕하세요. 오늘은 ${productName}에 대해 제품 정보와 활용 방법을 중심으로 간단하게 소개해보겠습니다.\n\n제품소개\n${productName}\n\n공개 조사에서 확인되는 제품 관련 내용은 다음과 같습니다. ${detail}\n\n추천이유\n${usableEvidence.length ? `공개 자료에서 확인되는 내용을 기준으로 보면 ${detail}와 관련된 용도로 살펴볼 만한 상품입니다.` : "현재 확인 가능한 자료만으로 특정 기능이나 성능을 근거로 추천 이유를 단정하지 않겠습니다."}\n\n장점\n${usableEvidence.length ? `공개 자료에서 확인되는 내용 중 제품을 선택할 때 참고할 만한 부분은 ${detail}입니다.` : "확인되지 않은 내용을 장점으로 만들어내지 않고, 공개 자료에서 확인되는 내용이 확보된 뒤 판단하는 것이 좋습니다."}\n\n단점\n${usableEvidence.length ? "공개 자료만으로 확인되지 않는 부분은 장점이나 단점으로 임의로 단정하지 않았습니다. 실제 사용 환경에서 중요하게 보는 조건은 상품 상세 정보를 기준으로 확인하는 것이 좋습니다." : "현재 공개 자료가 충분하지 않아 특정 단점을 사실처럼 적지 않았습니다."}\n\n어디에 사용하면 좋은지\n${usableEvidence.length ? `공개 자료에서 확인되는 ${detail}와 관련된 용도로 살펴보는 것이 좋습니다.` : "구체적인 사용처는 확인된 제품 상세 정보가 확보된 뒤 정하는 것이 좋습니다."}\n\n추천 사용처\n${usableEvidence.length ? "제품의 공개 설명에서 확인되는 용도와 본인의 사용 목적이 맞는 경우 후보로 비교해볼 수 있습니다." : "현재 확인 가능한 자료만으로 특정 사용처를 임의로 추천하지 않습니다."}\n\n파트너스 링크\n관심이 있다면 아래 상품 확인 버튼을 통해 판매 페이지에서 제품의 상세 정보를 확인해보세요.\n\n마무리 인사\n오늘은 확인 가능한 자료를 바탕으로 ${productName}을 간단하게 살펴봤습니다. 필요한 용도에 맞는 상품인지 비교해보시고, 편하게 확인해보세요.`;

    return JSON.stringify({ titles, selectedTitle: titles[0], body });
  }

  return JSON.stringify({ keyword: "생활용품", source: "fallback" });
}

'''
          s = s[:start] + new + s[end:]
          p.write_text(s, encoding="utf-8")
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/src/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "Use research-based product article structure"
          git push
