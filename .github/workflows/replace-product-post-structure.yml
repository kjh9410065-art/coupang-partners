name: Replace product post structure
on:
  push:
    paths:
      - ".github/workflows/replace-product-post-structure.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch article generator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("cloudflare/src/index.ts")
          s = p.read_text(encoding="utf-8")
          start = s.index('  if (prompt.includes("[확인된 상품 정보]")) {')
          end = s.index('  return JSON.stringify({ keyword: "생활용품", source: "fallback" });', start)
          new = '''  if (prompt.includes("[확인된 상품 정보]")) {
    const keyword = prompt.match(/검색 주제:\\s*(.+)/)?.[1]?.trim() || "상품 정보";
    const productName = prompt.match(/상품명:\\s*(.+)/)?.[1]?.trim() || keyword;

    // 상품명에서 특징을 추출하지 않습니다. 공개 조사 결과만 근거로 사용합니다.
    let evidence: string[] = [];
    try {
      const researchMatch = prompt.match(/\\[팩트체크용 제품 조사 결과\\]\\s*([\\s\\S]*?)\\n\\n\\[참고용 사용자 의견 신호\\]/);
      if (researchMatch) {
        const research = JSON.parse(researchMatch[1]);
        evidence = Array.isArray(research?.evidence)
          ? research.evidence.filter((x) => typeof x === "string" && x.trim()).map((x) => x.replace(/\\s+/g, " ").trim())
          : [];
      }
    } catch {}

    const usableEvidence = [...new Set(evidence)].slice(0, 4);
    const detail = usableEvidence.length
      ? usableEvidence.join(" ")
      : "공개 조사에서 확인된 상세 설명이 부족합니다.";

    const titles = [
      `${productName} 제품 소개와 활용 방법`,
      `${productName} 특징과 추천 사용처 알아보기`,
      `${productName} 어떤 분께 잘 맞을까?`,
      `${productName} 장점과 아쉬운 점 정리`,
      `${productName} 제품 정보와 활용 아이디어`,
    ];

    // 가격·배송·검색순위는 본문에 넣지 않고, 지정한 상품 소개 구조만 사용합니다.
    const body = `안녕하세요. 오늘은 ${productName}을 제품 정보와 활용 방법 중심으로 소개해볼게요.\\n\\n제품소개\\n${productName}\\n\\n${detail}\\n\\n추천이유\\n${usableEvidence.length ? `공개 자료에서 확인되는 내용을 기준으로 보면 ${detail}와 관련된 용도로 살펴볼 만한 제품입니다.` : "현재 확인된 자료만으로 특정 기능이나 성능을 근거로 추천 이유를 단정하지 않았습니다."}\\n\\n장점\\n${usableEvidence.length ? `공개 자료에서 확인되는 내용 중 참고할 만한 부분은 ${detail}입니다.` : "확인되지 않은 기능을 장점으로 만들어내지 않았습니다."}\\n\\n단점\\n${usableEvidence.length ? "공개 자료에서 확인되지 않은 부분은 임의로 단점이라고 단정하지 않았습니다. 실제 구매 전에 상세 설명과 구성 정보를 확인하는 것이 좋습니다." : "현재 공개 자료가 부족해 특정 단점을 사실처럼 적지 않았습니다."}\\n\\n어디에 사용하면 좋은지\\n${usableEvidence.length ? `공개 자료에서 확인되는 내용과 실제 사용 목적이 맞는 경우 활용을 고려해볼 수 있습니다.` : "구체적인 사용처는 확인된 제품 설명을 기준으로 판단하는 것이 좋습니다."}\\n\\n추천사용처\\n${usableEvidence.length ? "제품의 공개 설명에 나온 용도와 본인의 사용 목적이 맞는 경우 비교 대상으로 추천할 수 있습니다." : "현재 확인된 자료만으로 특정 사용처를 임의로 추천하지 않았습니다."}\\n\\n파트너스 링크\\n관심이 있다면 아래 상품 확인 버튼을 통해 판매 페이지의 상세 정보를 확인해보세요.\\n\\n마무리 인사\\n오늘은 확인 가능한 자료를 기준으로 ${productName}을 간단하게 소개해봤습니다. 필요한 용도와 잘 맞는지 편하게 비교해보세요.`;

    return JSON.stringify({ titles, selectedTitle: titles[0], body });
  }

'''
          s = s[:start] + new + s[end:]
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/src/index.ts
          git commit -m "Use research-based product blog structure"
          git rm .github/workflows/replace-product-post-structure.yml
          git commit -m "Remove temporary structure patch workflow"
          git push
