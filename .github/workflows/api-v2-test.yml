name: Coupang API v2 unit tests
on:
  push:
    branches: [ "refactor/coupang-api-v2" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests (no API secrets)
        run: cd cloudflare && npm test
