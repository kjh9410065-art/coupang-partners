name: Manual recommendation checks
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'cloudflare/src/**'
      - 'cloudflare/tests/**'
      - 'cloudflare/wrangler.jsonc'
      - '.github/workflows/naver-copy-quality.yml'
  workflow_dispatch:

jobs:
  copy-and-sync-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test article quality, pricing and draft sync
        run: node --experimental-strip-types --test cloudflare/tests/*.test.mjs

