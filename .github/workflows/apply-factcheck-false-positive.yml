name: Apply factcheck false-positive patch

on:
  push:
    branches: [main]
    paths:
      - '.github/patch_factcheck_false_positive.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/patch_factcheck_false_positive.py
      - name: Validate TypeScript build
        working-directory: cloudflare
        run: npx --yes wrangler@latest deploy --dry-run --outdir=.wrangler-dry-run
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/src/index.ts cloudflare/src/factcheck.ts
          git commit -m 'fix: prevent factcheck false positives' || echo 'No source changes to commit'
          git push
      - name: Remove temporary patch files
        run: |
          rm -f .github/patch_factcheck_false_positive.py .github/workflows/apply-factcheck-false-positive.yml
          git add -A
          git commit -m 'chore: remove temporary factcheck patch workflow' || echo 'Temporary files already removed'
          git push
