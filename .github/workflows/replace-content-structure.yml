name: Replace content structure

on:
  push:
    paths:
      - ".github/replace_content.py"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply content structure
        run: python .github/replace_content.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/src/index.ts
          git diff --cached --quiet || (git commit -m "Use structured natural product posts" && git push)
