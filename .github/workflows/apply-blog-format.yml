name: Apply natural product blog format

on:
  push:
    paths-ignore:
      - ".github/workflows/apply-blog-format.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite blog generation format
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("cloudflare/src/index.ts")
          s = p.read_text(encoding="utf-8")

          # AI 무료 한도가 없어도 동일한 글 구조가 나오도록 fallback 본문을 통째로 교체합니다.
          start = s.index('  if (prompt.includes("[확인된 상품 정보]")) {')
          end = s.index('  return JSON.stringify({ keyword: "생활용품", source: "fallback" });', start)
          new_fallback = r'''  if (prompt.includes("[확인된 상품 정보]")) {
    const keyword = prompt.match(/검색 주제:\s*(.+)/)?.[1]?.trim() || "상품 정보";
    const productName = prompt.match(/상품명:\s*(.+)/)?.[1]?.trim() || keyword;

    // 상품명에 실제로 포함된 표현만 특징으로 사용해 확인되지 않은 스펙을 만들지 않습니다.
    const nameParts = productName.split(/\s+/).filter(Boolean);
    const featureWords = nameParts.filter((word) => /LED|링라이트|조명|촬영|핸드폰|거치대|높이조절|유튜브|수직촬영|캠핑|보온|은박|마라톤|계곡|등산|러닝|실버|방한|무선|청소기|헤드브러시|침구브러시|필터/i.test(word));
    const features = featureWords.length ? [...new Set(featureWords)].join(", ") : productName;

    const titles = [
      `${productName} 특징과 활용법 알아보기`,
      `${keyword} ${productName} 어떤 점이 좋을까?`,
      `${productName} 제품 특징과 추천 사용처 정리`,
      `${keyword} 찾는다면 살펴볼 ${productName} 정보`,
      `${productName} 장점과 활용하기 좋은 곳`
    ];

    // 가격·배송·검색순위는 사용하지 않고, 상품명에서 확인되는 내용 중심으로 작성합니다.
    const body = `안녕하세요. 오늘은 ${keyword} 검색 결과에서 확인된 ${productName}을 소개해보려고 합니다.\n\n제품소개\n${productName}은 상품명에서 ${features} 등의 특징을 확인할 수 있는 제품입니다. 상품명에 함께 표시된 표현을 보면 어떤 용도로 활용할 수 있는지 어느 정도 방향을 잡을 수 있습니다. 다만 상품명만으로 확인되지 않는 세부 사양이나 구성은 임의로 추가하지 않고, 확인되는 특징을 중심으로 소개하겠습니다.\n\n추천이유\n이 제품은 ${features}처럼 상품명에 용도나 특징이 비교적 구체적으로 표시되어 있어 필요한 목적이 분명한 분이라면 살펴보기 좋습니다. 특히 ${keyword}와 관련된 제품을 찾으면서 특정 기능이나 사용 목적을 중요하게 보는 경우 상품명에 적힌 특징을 기준으로 비교해볼 수 있습니다.\n\n장점\n가장 눈에 띄는 부분은 상품명에서 ${features}와 같은 특징을 확인할 수 있다는 점입니다. 필요한 용도가 분명하다면 제품을 찾을 때 원하는 조건과 맞는지 빠르게 비교하기 편합니다. 여러 제품을 함께 살펴볼 때도 상품명에 표시된 특징을 기준으로 원하는 제품을 좁혀볼 수 있습니다.\n\n단점\n반대로 상품명만으로는 실제 성능이나 세부적인 구성까지 모두 확인하기 어렵습니다. 따라서 여기에서 확인되지 않는 기능을 장점이나 단점으로 단정하기보다는 필요한 항목이 있다면 상품 상세 페이지에서 직접 확인하는 것이 좋습니다.\n\n어디에 사용하면 좋은지\n상품명에 표시된 특징을 기준으로 보면 ${productName}은 ${features}와 관련된 용도로 활용할 때 살펴보기 좋은 제품입니다. 사용하려는 목적이 상품명에 표시된 내용과 맞는지 먼저 생각해보면 제품을 선택하는 데 도움이 됩니다.\n\n추천사용처\n${features}가 필요한 상황에서 활용하기 좋습니다. 예를 들어 상품명에 촬영이나 거치와 관련된 표현이 있다면 촬영 환경에서, 캠핑이나 보온과 관련된 표현이 있다면 해당 활동을 준비할 때 살펴볼 수 있습니다. 실제 사용 가능한 범위와 구성은 상품 상세 페이지의 안내를 기준으로 확인해주세요.\n\n마무리\n${productName}은 상품명에서 확인되는 ${features}라는 특징을 중심으로 살펴볼 수 있는 제품입니다. 내가 필요한 용도와 상품명에 표시된 특징이 잘 맞는지 비교해보고, 더 자세한 기능이나 구성은 판매 페이지에서 확인하면 좋겠습니다. 관심이 있다면 아래 상품 링크에서 자세한 정보를 확인해보세요.\n\n오늘은 ${productName}의 확인 가능한 특징과 활용하기 좋은 상황을 중심으로 간단하게 소개해봤습니다. 필요한 용도에 잘 맞는 제품인지 천천히 비교해보시면 좋겠습니다.`;

    return JSON.stringify({ titles, selectedTitle: titles[0], body });
  }

'''
          s = s[:start] + new_fallback + s[end:]

          # 실제 AI 생성 프롬프트도 같은 구조를 강제합니다. 현재 fallback이 주로 사용되더라도 재활성화 시 형식이 흔들리지 않게 합니다.
          prompt_start = s.index('  const prompt = `너는 한국 네이버 블로그에 바로 게시할 수 있는 상품 정보 글을 쓰는 전문 에디터다.')
          prompt_end = s.index('`;', prompt_start) + 2
          new_prompt = r'''  const prompt = `너는 한국 네이버 블로그에 바로 게시할 수 있는 자연스러운 상품 소개 글을 쓰는 전문 에디터다.

[확인된 상품 정보]
검색 주제: ${keyword}
상품명: ${product.productName}
상품 이미지 수: ${imageUrls.length}장

[참고용 사용자 의견 신호]
${opinionText}

[작성 형식 - 반드시 이 순서를 지킨다]
1. 인사말
2. 제품소개 - 상품 이름과 상품명에서 실제로 확인되는 특징을 자연스럽게 설명
3. 추천이유 - 어떤 사람에게 왜 살펴볼 만한지
4. 장점 - 확인 가능한 특징을 바탕으로 작성
5. 단점 - 확인되지 않은 기능을 억지로 단점으로 만들지 말고, 정보상 확인하기 어려운 부분은 자연스럽게 표현
6. 어디에 사용하면 좋은지
7. 추천사용처 - 구체적인 상황을 자연스럽게 제안하되 상품명에서 뒷받침되지 않는 기능은 만들지 않는다
8. 마무리 인사

[중요]
- 가격, 배송, 검색 순위, 가격 경쟁력, 할인, 리뷰 수, 평점은 본문에서 언급하지 않는다.
- 파트너스 고지문과 상품 링크는 프로그램이 별도로 붙이므로 본문에 직접 작성하지 않는다.
- 상품명에 없는 성능, 소재, 크기, 구성품, 배터리, 출력, 흡입력 등의 정보를 상상해서 쓰지 않는다.
- 직접 사용한 것처럼 쓰지 않는다.
- '내돈내산', '써보니', '사용해보니', '무조건', '최저가' 같은 과장 표현을 쓰지 않는다.
- 상품명을 문단마다 반복하지 말고 자연스럽게 대명사나 '이 제품'을 섞어 쓴다.
- 구매 주의사항만 반복하는 글이 아니라 실제 제품의 특징과 활용을 설명하는 글이어야 한다.
- 소제목을 포함하고 각 항목을 충분히 설명하되 같은 내용을 반복해서 글자 수를 늘리지 않는다.
- 모바일에서 읽기 좋은 짧은 문단으로 작성한다.
- 제목은 5개를 만들고 서로 표현을 다르게 한다.
- 과거 제목과 지나치게 비슷한 제목은 피한다.
- 자연스러운 한국어 블로그 말투를 사용한다.

JSON만 반환:
{
  "titles":["제목1","제목2","제목3","제목4","제목5"],
  "selectedTitle":"대표 제목",
  "body":"인사말부터 마무리 인사까지의 본문"
}`;'''
          s = s[:prompt_start] + new_prompt + s[prompt_end:]
          p.write_text(s, encoding="utf-8")

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/src/index.ts .github/workflows/apply-blog-format.yml
          git commit -m "Use natural product-focused blog structure"
          git rm .github/workflows/apply-blog-format.yml
          git commit -m "Remove temporary blog format workflow"
          git push