name: Apply factcheck patch

on:
  push:
    paths:
      - ".github/patch-factcheck.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/patch-factcheck.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/src/index.ts cloudflare/src/factcheck.ts
          git commit -m "Add product research and one-pass factcheck" || exit 0
          git push
      - name: Remove temporary patch files
        run: |
          rm -f .github/patch-factcheck.py .github/workflows/apply-factcheck-patch.yml
          git add -A
          git commit -m "Remove temporary factcheck patch workflow" || exit 0
          git push
