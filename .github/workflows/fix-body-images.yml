name: Fix body image placement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch dashboard image renderer
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("cloudflare/src/dashboard.ts")
          s = path.read_text(encoding="utf-8")

          start = s.index("function renderBodyWithImages(body: string, images: string[]) {")
          end = s.index("\n}\n\n/** 저장된 글의 이미지/본문/복사 영역을 카드 형태로 만듭니다. */", start) + 2

          replacement = r'''function renderBodyWithImages(body: string, images: string[]) {
            // 생성 본문이 빈 줄을 사용하지 않아도 이미지가 본문 중간에 들어가도록
            // 한 줄 단위까지 안전하게 문단을 나눕니다.
            const paragraphs = body
              .split(/\n\s*\n|\n/)
              .map((item) => item.trim())
              .filter(Boolean);

            if (!images.length) return escapeHtml(body);

            const output: string[] = [];
            const usedImages = new Set<number>();

            paragraphs.forEach((paragraph, index) => {
              output.push(`<p>${escapeHtml(paragraph)}</p>`);

              // 본문 초반부터 일정한 간격으로 이미지를 배치합니다.
              const imageIndex = index === 1 ? 0 : index === 4 ? 1 : index === 7 ? 2 : -1;
              if (imageIndex >= 0 && imageIndex < images.length) {
                usedImages.add(imageIndex);
                output.push(
                  `<figure class="body-image-wrap"><img class="body-image" src="${escapeHtml(images[imageIndex])}" alt="상품 이미지 ${imageIndex + 1}" loading="lazy"><figcaption>상품 이미지 ${imageIndex + 1}</figcaption></figure>`,
                );
              }
            });

            // 본문이 짧아서 정해진 위치가 나오지 않아도 확보한 이미지는 모두 표시합니다.
            images.forEach((url, index) => {
              if (usedImages.has(index)) return;
              output.push(
                `<figure class="body-image-wrap"><img class="body-image" src="${escapeHtml(url)}" alt="상품 이미지 ${index + 1}" loading="lazy"><figcaption>상품 이미지 ${index + 1}</figcaption></figure>`,
              );
            });

            return output.join("");
          }'''

          s = s[:start] + replacement + s[end:]
          path.write_text(s, encoding="utf-8")

          # 일회성 패치 워크플로는 수정 완료 후 제거합니다.
          workflow = Path(".github/workflows/fix-body-images.yml")
          workflow.unlink(missing_ok=True)

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "cloudflare/src/dashboard.ts", ".github/workflows/fix-body-images.yml"], check=True)
          subprocess.run(["git", "commit", "-m", "본문 이미지가 항상 본문 중간에 표시되도록 수정"], check=True)
          subprocess.run(["git", "push", "origin", "main"], check=True)
