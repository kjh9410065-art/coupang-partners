name: one-time Workers AI fallback patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Gemini fallback
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path("cloudflare/src/index.ts")
          text = index.read_text(encoding="utf-8")

          # Workers AI 바인딩 타입을 Env에 추가합니다.
          if "  AI: Ai;" not in text:
              text = text.replace("  CONTENT_STORE: KVNamespace;\n}", "  CONTENT_STORE: KVNamespace;\n  AI: Ai;\n}", 1)

          # 기존 Gemini 호출기를 Gemini 우선 + Workers AI 대체 구조로 교체합니다.
          pattern = r'/\*\*\n \* Gemini REST API 호출기입니다\.[\s\S]*?\n}\n\n/\*\* Google Trends 한국 급상승 검색어를 오늘의 관심 신호로 가져옵니다\. \*/'
          replacement = r'''/**
 * Gemini REST API 호출기입니다.
 * Gemini가 지역/IP 판정으로 차단되면 Cloudflare Workers AI를 자동으로 사용합니다.
 */
async function generateGemini(env: Env, prompt: string, maxOutputTokens = 4096): Promise<string> {
  let lastError = "Gemini 호출 실패";

  // 1순위: 기존 Gemini API를 그대로 사용합니다.
  for (const model of GEMINI_MODELS) {
    for (let attempt = 1; attempt <= 3; attempt++) {
      try {
        const response = await fetch(`${GEMINI_HOST}/${model}:generateContent`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": env.GEMINI_API_KEY,
          },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              maxOutputTokens,
              thinkingConfig: { thinkingLevel: "low" },
              responseMimeType: "application/json",
            },
          }),
        });

        const text = await response.text();
        if (response.status === 503) {
          lastError = `Gemini ${model} 503`;
          continue;
        }
        if (!response.ok) throw new Error(`Gemini API 오류 (${response.status}): ${text.slice(0, 500)}`);

        const data = JSON.parse(text);
        const output = data?.candidates?.[0]?.content?.parts?.map((part: any) => part?.text ?? "").join("").trim();
        if (!output) throw new Error(`Gemini ${model} 응답에 텍스트가 없습니다.`);
        return output;
      } catch (error) {
        if (error instanceof Error) lastError = error.message;
        if (attempt < 3) continue;
        break;
      }
    }
  }

  // 2순위: Gemini가 지역/IP 문제 등으로 실패하면 Cloudflare Workers AI를 사용합니다.
  // JSON Mode를 지원하는 Llama 3.3 70B를 사용해 기존 JSON 파싱 구조를 그대로 유지합니다.
  try {
    const fallback = await env.AI.run("@cf/meta/llama-3.3-70b-instruct-fp8-fast", {
      prompt,
      max_tokens: Math.min(Math.max(maxOutputTokens, 256), 8192),
      response_format: { type: "json_object" },
    });

    const output = typeof fallback === "string"
      ? fallback
      : typeof (fallback as any)?.response === "string"
        ? (fallback as any).response
        : typeof (fallback as any)?.result?.response === "string"
          ? (fallback as any).result.response
          : "";

    if (output.trim()) return output.trim();
    throw new Error("Workers AI 응답에 텍스트가 없습니다.");
  } catch (fallbackError) {
    const fallbackMessage = fallbackError instanceof Error ? fallbackError.message : "Workers AI 호출 실패";
    throw new Error(`${lastError} / 대체 AI도 실패: ${fallbackMessage}`);
  }
}

/** Google Trends 한국 급상승 검색어를 오늘의 관심 신호로 가져옵니다. */'''

          new_text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit("Gemini 호출기 패치 대상을 찾지 못했습니다.")

          index.write_text(new_text, encoding="utf-8")

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-workers-ai-fallback.yml
          git add cloudflare/src/index.ts cloudflare/wrangler.jsonc
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          git commit -m "Gemini 지역 오류 시 Workers AI로 자동 대체"
          git push
