name: one-time offline generation patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace AI generator with safe fallback
        shell: python
        run: |
          from pathlib import Path
          import re
          from textwrap import dedent

          path = Path("cloudflare/src/index.ts")
          text = path.read_text(encoding="utf-8")

          pattern = r'async function generateGemini\(env: Env, prompt: string, maxOutputTokens = 4096\): Promise<string> \{[\s\S]*?\n\}\n\n/\*\* Google Trends 한국 급상승 검색어를 오늘의 관심 신호로 가져옵니다\. \*/'

          replacement = dedent(r'''
          /**
           * 외부 AI 무료 한도가 소진된 동안 사용하는 안전한 생성기입니다.
           * 쿠팡 API에서 확인된 값만 사용하며, 임의의 상품 기능이나 스펙을 만들지 않습니다.
           */
          async function generateGemini(env: Env, prompt: string, maxOutputTokens = 4096): Promise<string> {
            // 상품 선정 단계에서는 쿠팡 검색 후보 중 첫 번째 상품을 선택합니다.
            if (prompt.includes("상품 후보:")) {
              const match = prompt.match(/상품 후보:\s*([\s\S]*?)\n\n공개 웹 검색/);
              if (match) {
                try {
                  const candidates = JSON.parse(match[1]);
                  const first = Array.isArray(candidates) ? candidates[0] : null;
                  if (first?.productId != null) {
                    return JSON.stringify({
                      productId: String(first.productId),
                      reason: "검색 주제와 현재 검색 결과의 관련성을 기준으로 선정했습니다."
                    });
                  }
                } catch {}
              }
            }

            // 오늘의 검색어 선정 단계에서는 안전한 상품군을 사용합니다.
            if (prompt.includes("Google Trends 한국 급상승 검색어 원문")) {
              return JSON.stringify({
                keyword: "무선청소기",
                source: "fallback",
                reason: "외부 AI 한도 초과 시 사용하는 안전한 기본 상품군입니다."
              });
            }

            // 본문 생성 단계에서는 프롬프트에 들어온 확인값만 사용합니다.
            if (prompt.includes("[확인된 상품 정보]")) {
              const keyword = prompt.match(/검색 주제:\s*(.+)/)?.[1]?.trim() || "상품 정보";
              const productName = prompt.match(/상품명:\s*(.+)/)?.[1]?.trim() || keyword;
              const price = prompt.match(/현재 검색 결과 가격:\s*(.+)/)?.[1]?.trim() || "확인 불가";
              const rank = prompt.match(/검색 결과 순위:\s*(.+)/)?.[1]?.trim() || "확인 불가";
              const rocket = prompt.match(/로켓배송:\s*(.+)/)?.[1]?.trim() || "확인 불가";
              const freeShipping = prompt.match(/무료배송:\s*(.+)/)?.[1]?.trim() || "확인 불가";

              const titles = [
                `${productName} 상품 정보와 구매 전 확인할 점`,
                `${keyword} 찾는다면 ${productName} 살펴보기`,
                `${productName} 고를 때 확인하면 좋은 정보`,
                `${keyword} 상품 비교 전에 알아둘 ${productName} 정보`,
                `${productName} 현재 검색 정보와 체크 포인트`
              ];

              const body = `${productName}을(를) 찾고 있다면 제품을 고르기 전에 몇 가지 정보를 먼저 확인해보는 것이 좋습니다. 안녕하세요. 오늘은 ${keyword} 검색 결과에서 확인된 ${productName}에 대해 부담 없이 살펴볼게요.

${productName}은 현재 쿠팡 상품 검색 결과에서 확인된 상품입니다. 이 글에서는 확인할 수 있는 상품 정보와 구매 전에 직접 체크하면 좋은 부분을 정리해보겠습니다. 상품명만으로 확인되지 않는 세부 기능이나 구성은 임의로 단정하지 않고 실제 상품 페이지의 상세 내용을 기준으로 확인하는 것이 가장 정확합니다.

현재 검색 결과에서 확인된 가격은 ${price}원이며 검색 결과 순위는 ${rank}입니다. 가격과 순위는 검색 시점에 따라 달라질 수 있기 때문에 이 숫자만으로 상품의 전체적인 가치를 판단하기보다는 구매하는 시점의 정보를 다시 확인하는 편이 좋습니다.

배송 조건도 함께 살펴볼 필요가 있습니다. 현재 검색 결과에서는 로켓배송 ${rocket}, 무료배송 ${freeShipping}으로 확인됩니다. 배송 조건 역시 주문 시점이나 판매 조건에 따라 달라질 수 있으니 실제 구매 화면에서 한 번 더 확인해 주세요.

특히 ${keyword}처럼 비슷한 상품이 많은 분야에서는 이름이 비슷하다는 이유만으로 제품의 세부 사양까지 같다고 생각하지 않는 것이 좋습니다. 필요한 용도와 원하는 크기, 구성, 사용 환경을 먼저 정한 다음 상품 상세 페이지의 옵션과 안내 내용을 비교하면 선택하기가 훨씬 편합니다.

구매 전에 확인할 부분도 있습니다. 필요한 옵션이 맞는지, 원하는 구성으로 선택되어 있는지, 배송 조건과 판매 정보를 확인했는지 차례대로 살펴보세요. 가격만 비교하기보다는 실제로 필요한 조건을 충족하는지를 함께 보는 것이 좋습니다.

또한 검색 결과의 가격이나 순위는 고정된 정보가 아닙니다. 같은 상품이라도 시간이 지나면 검색 위치나 가격, 배송 조건이 달라질 수 있으므로 글을 본 뒤 실제 상품 페이지에서 최신 정보를 확인하는 것이 안전합니다.

정리하면 ${productName}은 현재 ${keyword} 검색 결과에서 확인할 수 있는 상품이고 구매를 결정하기 전에는 상품 상세 정보와 옵션, 배송 조건, 현재 가격을 함께 확인하는 것이 좋습니다. 특정 상품이 누구에게나 맞는다고 단정하기보다는 본인의 사용 목적에 맞는지를 기준으로 살펴보시면 됩니다.

관심이 있다면 아래 상품 확인 버튼을 통해 현재 판매 페이지의 최신 정보를 직접 확인해보세요. 오늘은 여기까지 간단하게 정리해봤습니다. 필요한 조건을 하나씩 비교해보면서 본인에게 맞는 상품인지 천천히 확인해보시면 좋겠습니다.`;

              return JSON.stringify({ titles, selectedTitle: titles[0], body });
            }

            return JSON.stringify({
              keyword: "생활용품",
              source: "fallback",
              reason: "외부 AI 한도 초과 시 안전한 기본값을 사용합니다."
            });
          }

          /** Google Trends 한국 급상승 검색어를 오늘의 관심 신호로 가져옵니다. */
          ''').lstrip()

          new_text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit("generateGemini 교체 대상을 찾지 못했습니다.")
          path.write_text(new_text, encoding="utf-8")

      - name: Remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/src/index.ts
          git commit -m "fix: deterministic content generation while AI quotas are exhausted"
          git rm .github/workflows/patch-offline-fallback.yml
          git commit -m "chore: remove one-time offline generation workflow"
          git push
