name: Patch deterministic fallback quality

on:
  push:
    paths-ignore:
      - ".github/workflows/patch-fallback-quality.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve deterministic fallback
        shell: python
        run: |
          from pathlib import Path
          p = Path("cloudflare/src/index.ts")
          s = p.read_text(encoding="utf-8")
          old = '''    const titles=[
      `${productName} 상품 정보와 구매 전 확인할 점`,
      `${keyword} 검색 결과에서 살펴본 ${productName}`,
      `구매 전에 확인할 ${productName} 기본 정보`,
      `${productName} 배송 조건과 현재 검색 정보 정리`,
      `${keyword} 상품을 고를 때 확인할 ${productName} 정보`
    ];'''
          new = '''    const titles=[
      `${productName} 상품 정보와 구매 전 확인할 점`,
      `${keyword} 검색 결과에서 살펴본 ${productName}`,
      `구매 전에 확인할 ${productName} 기본 정보`,
      `${productName} 배송 조건과 현재 검색 정보 정리`,
      `${keyword} 상품 선택 전 체크할 ${productName} 내용`
    ];'''
          if old in s:
              s = s.replace(old, new, 1)

          old_tail = '''\n\n관심이 있다면 상품 확인 버튼을 통해 현재 판매 페이지의 최신 정보를 직접 확인해보세요. 오늘은 확인 가능한 내용을 중심으로 간단하게 정리했습니다. 천천히 비교해보면서 본인에게 맞는 상품인지 살펴보시면 좋겠습니다.`;'''
          new_tail = '''\n\n관심이 있다면 상품 확인 버튼을 통해 현재 판매 페이지의 최신 정보를 직접 확인해보세요. 오늘은 확인 가능한 내용을 중심으로 간단하게 정리했습니다. 천천히 비교해보면서 본인에게 맞는 상품인지 살펴보시면 좋겠습니다.\n\n상품을 비교할 때는 먼저 내가 필요한 조건을 몇 가지로 좁혀보는 것이 편합니다. 예를 들어 필요한 용도와 원하는 옵션을 정한 뒤 현재 가격, 배송 조건, 상품 상세 안내를 차례로 확인하면 검색 결과만 보고 판단하는 실수를 줄일 수 있습니다. 검색 결과에 보이는 정보와 실제 주문 화면의 조건이 달라질 수 있다는 점도 함께 기억해두면 좋습니다.\n\n특히 상품명이 비슷한 제품은 이름만으로 같은 기능이나 같은 구성을 가진다고 판단하기 어렵습니다. 필요한 정보가 있다면 상품 상세 페이지에서 해당 항목을 직접 확인하고, 선택 가능한 옵션이 여러 개라면 원하는 옵션이 제대로 선택되어 있는지도 주문 전에 다시 살펴보세요. 이런 과정을 거치면 현재 확인된 정보와 실제 구매 조건을 구분하면서 보다 차분하게 비교할 수 있습니다.`;'''
          if old_tail in s:
              s = s.replace(old_tail, new_tail, 1)

          p.write_text(s, encoding="utf-8")
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/src/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "Improve deterministic fallback content quality"
          git push
