name: Bootstrap content generation

on:
  push:
    branches: [main]

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Wait for Cloudflare deployment
        run: sleep 120

      - name: Run one-time content generation
        id: generate
        run: |
          for i in {1..10}; do
            echo "Generation attempt $i"
            response=$(curl -sS --max-time 120 "https://coupang-partners.carpick.workers.dev/generate-bootstrap") || true
            echo "$response"
            if echo "$response" | grep -q '"ok":true'; then
              echo "success=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "success=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Remove temporary bootstrap code
        if: steps.generate.outputs.success == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --ff-only origin main
          rm -f cloudflare/src/bootstrap.ts cloudflare/src/worker.ts
          python - <<'PY'
          from pathlib import Path
          p = Path("cloudflare/wrangler.jsonc")
          text = p.read_text(encoding="utf-8")
          text = text.replace('"main": "src/worker.ts"', '"main": "src/index.ts"')
          text = text.replace('  // 초기 실제 생성 테스트와 매일 오전 9시(한국시간) 자동 생성을 함께 사용합니다.\n  "triggers": {\n    "crons": ["*/5 * * * *", "0 0 * * *"]\n  }', '  // 매일 오전 9시(한국시간)에 자동으로 콘텐츠를 생성합니다.\n  "triggers": {\n    "crons": ["0 0 * * *"]\n  }')
          p.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/bootstrap-generation.yml
          git add cloudflare/wrangler.jsonc
          git commit -m "Finalize daily automation after bootstrap"
          git push origin main
